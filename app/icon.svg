<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0B0B0C"/>
  <g transform="translate(7 14) scale(0.078)">
  <defs>
    <linearGradient id="g" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FCEBB0"/>
      <stop offset="0.35" stop-color="#EDC76F"/>
      <stop offset="0.75" stop-color="#D8A245"/>
      <stop offset="1" stop-color="#B9832F"/>
    </linearGradient>
    <path id="ribbon" d="
      M88 334
      C58 282 74 214 150 198
      C226 180 292 214 358 262
      C418 306 468 346 520 366
      C560 381 600 384 632 370
      C606 398 560 416 504 410
      C448 404 404 374 356 334
      C298 286 236 236 170 236
      C122 236 100 268 104 304
      C105 314 98 326 88 334 Z"/>
    <!-- Cuts a hairline gap into the letter wherever the ribbon crosses it.
         A mask rather than a black outline, so the gap is transparent and the
         mark sits on any background. -->
