      <rect width="640" height="430" fill="#fff"/>
      <use href="#ribbon" fill="#000" stroke="#000" stroke-width="14"/>
    </mask>
  </defs>
  
  <path mask="url(#gap)" fill="url(#g)" d="
    M300 4
    L494 356
